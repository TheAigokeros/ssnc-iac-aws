name: Deploy to ECS

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::<account-id>:role/github-deploy-role
          aws-region: ap-southeast-1

      - name: Login to ECR
        run: |
          aws ecr get-login-password \
          | docker login \
            --username AWS \
            --password-stdin <account-id>.dkr.ecr.ap-southeast-1.amazonaws.com

      - name: Build and push Docker image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -t <account-id>.dkr.ecr.ap-southeast-1.amazonaws.com/hello-world:${{ github.sha }} \
            --push .

      - name: Terraform apply
        run: |
          terraform init
          terraform apply -auto-approve \
            -var="container_image=<account-id>.dkr.ecr.ap-southeast-1.amazonaws.com/hello-world:${{ github.sha }}"
